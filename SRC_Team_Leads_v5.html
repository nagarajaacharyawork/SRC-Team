<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahyadri Robotics Club – Team Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080A0D;--card:#191D21;--card2:#12161A;--cy:#08B8DD;--tx:#FFFFFF;--mu:#B7C0C8;
--f-disp:'Anton','Bebas Neue',Impact,'Arial Narrow',sans-serif;--f-body:'Montserrat',Arial,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;font-family:var(--f-body);color:var(--tx)}
#stage{position:relative;overflow:hidden;container-type:size;touch-action:pan-y;user-select:none;-webkit-user-select:none;
background:radial-gradient(rgba(8,184,221,.085) .6px,transparent .7px) 0 0/12px 12px,var(--bg);
height:min(100dvh,calc(100vw*16/9));width:calc(min(100dvh,calc(100vw*16/9))*9/16)}
#logo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 3cqh);left:0;right:0;height:5cqh;display:flex;justify-content:center;z-index:2;pointer-events:none}
#logo img{height:100%;width:auto;display:block}
#track{display:flex;height:100%;width:100%;transition:transform .38s cubic-bezier(.22,.8,.24,1);will-change:transform}
#track.drag{transition:none}
.slide{flex:0 0 100%;height:100%;padding:calc(env(safe-area-inset-top,0px) + 10.5cqh) 6cqw 8.5cqh}

/* ---------- version C: layered robotics poster ---------- */
.lay{position:absolute;transform:translateX(calc(var(--d,0)*var(--k,0)*60cqw));transition:transform .38s cubic-bezier(.22,.8,.24,1);will-change:transform}
#track.drag .lay,#stage.init .lay{transition:none}
.card{position:relative;height:100%;container-type:size;background:var(--card);border-radius:5cqw;overflow:hidden}
.traces{inset:0;width:100%;height:100%}
.traces path{fill:none;stroke:var(--cy);stroke-width:.35;vector-effect:non-scaling-stroke}
.traces .base{opacity:.16}
.traces .pulse{stroke-width:1.1;stroke-dasharray:5 70;opacity:.7;animation:flow 7s linear infinite}
.traces .pulse.b{animation-duration:9s;animation-delay:-3s}
.traces circle{fill:var(--cy);opacity:.35}
@keyframes flow{to{stroke-dashoffset:-75}}
.gear{width:118cqw;height:118cqw;left:-1cqw;top:calc(36cqh - 59cqw)}
.gear svg{width:100%;height:100%;display:block;animation:spin 70s linear infinite}
.gear .g{fill:none;stroke:var(--cy);stroke-width:.55;opacity:.34;stroke-linejoin:round}
.gear .d{fill:none;stroke:var(--cy);stroke-width:.4;stroke-dasharray:1.2 2.4;opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}
.vname{left:1.5cqw;bottom:17cqh;writing-mode:vertical-rl;rotate:180deg;white-space:nowrap;font:400 22cqw/.92 var(--f-disp);text-transform:uppercase;letter-spacing:.015em}
.vname span{display:inline-block;animation:rise .6s cubic-bezier(.22,.8,.24,1) both}
.vname .o{color:transparent;-webkit-text-stroke:.5cqw var(--cy)}
.vname .f{color:var(--cy);margin-bottom:.02em}
@keyframes rise{from{transform:translateY(-8cqh);opacity:0}}
.outline{left:19cqw;right:8cqw;top:calc(5cqh + 2.2cqh);height:62cqh}
.outline svg,.photo svg{width:100%;height:100%;display:block}
.outline polygon{fill:none;stroke:var(--cy);stroke-width:1.4;vector-effect:non-scaling-stroke}
.photo{left:22cqw;right:5cqw;top:5cqh;height:62cqh;background:var(--card2);overflow:hidden;
 clip-path:polygon(0 9%,11% 0,100% 0,100% 90%,89% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.photo img.cut{object-fit:contain;object-position:bottom center}
.photo img.ph{object-fit:contain;padding:8cqh 10cqw 0;opacity:.85}
.photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,rgba(8,184,221,.22),transparent)}
.row{left:9cqw;right:7cqw;bottom:4.8cqh;display:flex;align-items:center;justify-content:space-between;gap:3cqw}
.role{display:flex;align-items:center;gap:3cqw;font:800 4.4cqw/1.1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--tx)}
.role::before{content:"";flex:0 0 auto;width:5.2cqw;height:5.2cqw;background:linear-gradient(115deg,var(--cy) 0 18%,transparent 18% 41%,var(--cy) 41% 59%,transparent 59%);transform:skewX(-14deg)}
.soc{display:flex;gap:2.6cqw}
.soc a{position:relative;width:11.5cqw;height:12.6cqw;display:grid;place-items:center;color:var(--tx);text-decoration:none;touch-action:manipulation;
 clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:var(--cy);transition:color .2s}
.soc a::before{content:"";position:absolute;inset:.45cqw;background:var(--card);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);transition:background .2s}
.soc a svg{position:relative;width:5cqw;height:5cqw;fill:currentColor}
.soc a:hover,.soc a:active,.soc a:focus-visible{color:#04141A;outline:none}
.soc a:hover::before,.soc a:active::before,.soc a:focus-visible::before{background:var(--cy)}
#segs{position:absolute;left:0;right:0;bottom:3cqh;height:2.6cqh;display:flex;justify-content:center;align-items:center;gap:2.4cqw}
#segs b{width:2cqw;height:2cqw;background:rgba(183,192,200,.28);cursor:pointer;position:relative;transition:width .25s,background .25s;border-radius:1cqw}
#segs b::after{content:"";position:absolute;inset:-3cqw -1.2cqw}
#segs b.on{background:var(--cy);width:6cqw}
@media (prefers-reduced-motion:reduce){#track,#segs b,.lay{transition:none}.gear svg,.traces .pulse,.vname span{animation:none}}
</style>
</head>
<body>
<main id="stage" class="init" aria-roledescription="carousel" aria-label="SRC team leads">
<div id="logo"></div>
<div id="track"></div>
<div id="segs" role="tablist" aria-label="Lead position"></div>
</main>

const GEAR=(()=>{const n=16,R=44,T=52,p=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n,s=Math.PI/n,w=[.5,.3];
 [[R,-w[0]],[T,-w[1]],[T,w[1]],[R,w[0]]].forEach(([r,k])=>{const t=a+k*s*1.6;p.push((r*Math.cos(t)).toFixed(2)+','+(r*Math.sin(t)).toFixed(2))})}
 return `<svg viewBox="-60 -60 120 120" aria-hidden="true"><polygon class="g" points="${p.join(' ')}"/><circle class="d" r="35"/><circle class="g" r="24"/><circle class="d" r="12"/></svg>`})();
const TR=['M100 14H86L80 20H60','M0 104H8L13 109V130L18 135H42','M100 150H78L72 144V128','M30 3V12L36 18H52','M100 96H92L88 100V112'];
const TRACES=`<svg viewBox="0 0 100 164" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${TR.map(d=>`<path class="base" d="${d}"/>`).join('')}
${TR.map((d,k)=>`<path class="pulse${k%2?' b':''}" d="${d}" style="animation-delay:${-k*1.4}s"/>`).join('')}
<circle cx="60" cy="20" r="1"/><circle cx="42" cy="135" r="1"/><circle cx="72" cy="128" r="1"/><circle cx="52" cy="18" r="1"/><circle cx="88" cy="112" r="1"/></svg>`;
const OUT='<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,9 11,0 100,0 100,90 89,100 0,100"/></svg>';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const track=document.getElementById('track'),stage=document.getElementById('stage'),segs=document.getElementById('segs');
const N=MEMBERS.length;
document.getElementById('logo').innerHTML=`<img src="${LOGO}" alt="Sahyadri Robotics Club logo">`;
const link=(u,l,svg)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="${l}">${svg}</a>`:'';
const phUri='data:image/svg+xml,'+encodeURIComponent(PH);
const split=n=>{const p=String(n).trim().split(/\s+/);return p.length>1?[p.slice(0,-1).join(' '),p[p.length-1]]:['',p[0]]};
track.innerHTML=MEMBERS.map((m,i)=>{const [a,b]=split(m.name);return `<section class="slide" aria-label="Lead ${i+1} of ${N}"><article class="card">
 <div class="lay traces" style="--k:-.12">${TRACES}</div>
 <div class="lay gear" style="--k:-.3">${GEAR}</div>
 <div class="lay vname" style="--k:.28" aria-label="${esc(m.name)}">${a?`<span class="o">${esc(a)}&nbsp;</span>`:''}<span class="f" style="animation-delay:.08s">${esc(b)}</span></div>
 <div class="lay outline" style="--k:.06">${OUT}</div>
 <div class="lay photo" style="--k:0"><img class="${m.photo?(m.cutout?'cut':''):'ph'}" src="${m.photo||phUri}" alt="${m.photo?esc(m.name):''}" draggable="false" ${i&&m.photo?'loading="lazy"':''}></div>
 <div class="lay row" style="--k:.1"><div class="role">${esc(m.role)}</div><div class="soc">${link(m.instagram,'Instagram',IG)}${link(m.linkedin,'LinkedIn',LI)}</div></div>
</article></section>`}).join('');
segs.innerHTML=MEMBERS.map((m,i)=>`<b data-i="${i}" role="tab" aria-label="Lead ${i+1}"></b>`).join('');
let idx=0,sx=0,sy=0,dx=0,down=false,moved=false,lock=null;
const slides=[...track.children];
function pos(p){slides.forEach((el,i)=>el.style.setProperty('--d',(i-p).toFixed(3)))}
function fit(){document.querySelectorAll('.vname').forEach(t=>{t.style.fontSize='';let s=parseFloat(getComputedStyle(t).fontSize);const max=t.closest('.card').clientHeight*.77;
 while(t.offsetHeight>max&&s>8){s-=.5;t.style.fontSize=s+'px'}})}
function replay(){slides[idx].querySelectorAll('.vname span').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation=''})}
function go(i,anim){const was=idx;idx=Math.max(0,Math.min(N-1,i));track.classList.remove('drag');track.style.transform=`translateX(${-idx*100}%)`;pos(idx);
 [...segs.children].forEach((b,k)=>{b.classList.toggle('on',k===idx);b.setAttribute('aria-selected',k===idx)});
 if(anim!==false&&was!==idx)replay();
 try{history.replaceState(null,'','#'+(idx+1))}catch(e){}}
stage.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('#segs'))return;down=true;moved=false;lock=null;sx=e.clientX;sy=e.clientY;dx=0});
stage.addEventListener('pointermove',e=>{if(!down)return;const x=e.clientX-sx,y=e.clientY-sy;
 if(!lock&&(Math.abs(x)>8||Math.abs(y)>8))lock=Math.abs(x)>Math.abs(y)?'x':'y';
 if(lock!=='x')return;moved=true;dx=x;if((idx===0&&x>0)||(idx===N-1&&x<0))dx=x*.25;
 track.classList.add('drag');track.style.transform=`translateX(${-idx*stage.clientWidth+dx}px)`;pos(idx-dx/stage.clientWidth)});
const end=()=>{if(!down)return;down=false;const t=stage.clientWidth*.18;go(lock==='x'?idx+(dx<-t?1:dx>t?-1:0):idx)};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);stage.addEventListener('pointerleave',()=>{if(down&&lock==='x')end()});
stage.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
stage.addEventListener('dragstart',e=>e.preventDefault());
segs.onclick=e=>{const b=e.target.closest('b');if(b)go(+b.dataset.i)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
addEventListener('resize',()=>{fit();go(idx,false)});
const h=parseInt(location.hash.slice(1));go(h>=1&&h<=N?h-1:0,false);
fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('init')));
</script>
</body>
</html>
